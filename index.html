<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuiaGamer - Detonados de Jogos</title>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Albert+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>
        <div class="header-marca">
            <h1>GuiaGamer</h1>
            <p>Seu guia de jogos concentrados em um só lugar e sem spoilers!</p>
        </div>
        <button type="button" id="btn-voltar" class="btn-voltar-header">← Voltar aos jogos</button>
    </header>

    <main>
        <!-- lista de jogos -->
        <section id="lista-jogos" class="painel-lista-jogos">
            <div class="cabecalho-secao">
                <h2>Jogos disponíveis <span id="contador-jogos" class="contador-jogos"></span></h2>
                <button id="btn-cadastrar-jogo" class="btn-acao">+ Cadastrar jogo</button>
            </div>
            <div id="jogos-container">
                <p>Carregando jogos...</p>
            </div>
        </section>

        <!-- tela do detonado - escondida -->
        <section id="tela-detonado" style="display: none;">
            <div class="layout-etapa">
                <aside class="sidebar-jogo" id="sidebar-jogo">
                    <div class="sidebar-capa" id="sidebar-capa">
                        <span>capa do jogo</span>
                    </div>
                    <h2 id="sidebar-nome-jogo"></h2>
                    <p class="plataforma" id="sidebar-plataforma"></p>

                    <div class="sidebar-progresso">
                        <div class="progresso-cabecalho">
                            <span>Progresso</span>
                            <span id="progresso-percentual">0%</span>
                        </div>
                        <div class="barra-progresso">
                            <div class="barra-progresso-fill" id="barra-progresso-fill"></div>
                        </div>
                        <p class="progresso-texto" id="progresso-texto">0 de 0 etapas concluídas</p>
                    </div>

                    <ul class="lista-etapas-nav" id="lista-etapas-nav"></ul>

                    <button type="button" id="btn-cadastrar-etapa" class="btn-cadastrar-etapa-sidebar">+ Cadastrar etapa</button>
                </aside>

                <div class="painel-etapa" id="painel-etapa">
                    <!-- etapa ativa renderizada via javascript -->
                </div>
            </div>
        </section>

        <!-- tela do formulario de cadastrar jogo -->
        <section id="tela-cadastrar-jogo" style="display: none;">
            <button id="btn-voltar-cadastro" class="btn-secundario">← Voltar</button>

            <h2>Cadastrar novo jogo</h2>

            <div class="container-cadastro">
                <div class="preview-capa" id="preview-capa" style="display: none;">
                    <img id="preview-imagem" src="" alt="Capa do jogo">
                </div>

                <form id="form-cadastrar-jogo">
                    <div class="campo">
                        <label for="input-nome">Nome do jogo</label>
                        <div class="campo-com-botao">
                            <input type="text" id="input-nome" required placeholder="Ex: Super Mario World">
                            <button type="button" id="btn-buscar-externo" class="btn-secundario">Buscar</button>
                        </div>
                    </div>

                    <div id="resultados-externos"></div>

                    <div class="campo">
                        <label for="input-plataforma">Plataforma</label>
                        <input type="text" id="input-plataforma" required placeholder="Ex: Super Nintendo">
                    </div>

                    <div class="campo">
                        <label for="input-descricao">Descrição (opcional)</label>
                        <textarea id="input-descricao" rows="4" placeholder="Sobre o que é o jogo..."></textarea>
                    </div>

                    <input type="hidden" id="input-imagem-url">

                    <div class="form-botoes">
                        <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
                        <button type="submit" class="btn-acao">Salvar jogo</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- tela do formulario de cadastrar etapa -->
        <section id="tela-cadastrar-etapa" style="display: none;">
            <button id="btn-voltar-etapa" class="btn-secundario">Voltar</button>

            <h2>Nova etapa - <span id="nome-jogo-etapa"></span></h2>

            <form id="form-cadastrar-etapa">
                <div class="campo">
                    <label for="input-numero">Número da etapa</label>
                    <input type="number" id="input-numero" required min="1" placeholder="Ex: 1">
                </div>

                <div class="campo">
                    <label for="input-titulo">Título da etapa (sem spoilers!)</label>
                    <input type="text" id="input-titulo" required placeholder="Ex: Como derrotar o primeiro chefe">
                </div>

                <div class="campo">
                    <label for="input-pista-leve">Pista leve</label>
                    <textarea id="input-pista-leve" rows="3" required
                        placeholder="Uma dica sutil, sem spoilers diretos..."></textarea>
                </div>

                <div class="campo">
                    <label for="input-pista-media">Pista direta</label>
                    <textarea id="input-pista-media" rows="3" required
                        placeholder="Uma dica mais clara, mas ainda sem entregar tudo..."></textarea>
                </div>

                <div class="campo">
                    <label for="input-resposta-completa">Passo completo</label>
                    <textarea id="input-resposta-completa" rows="4" required
                        placeholder="A resposta detalhada, passo a passo..."></textarea>
                </div>

                <div class="form-botoes">
                    <button type="button" id="btn-cancelar-etapa" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-acao">Salvar etapa</button>
                </div>
            </form>
        </section>

        <section id="tela-editar-jogo" style="display: none;">
            <button id="btn-voltar-editar-jogo" class="btn-secundario">← Voltar</button>

            <h2>Editar jogo</h2>

            <form id="form-editar-jogo">
                <div class="campo">
                    <label for="input-editar-nome">Nome do jogo</label>
                    <input type="text" id="input-editar-nome" required>
                </div>

                <div class="campo">
                    <label for="input-editar-plataforma">Plataforma</label>
                    <input type="text" id="input-editar-plataforma" required>
                </div>

                <div class="campo">
                    <label for="input-editar-descricao">Descrição</label>
                    <textarea id="input-editar-descricao" rows="4"></textarea>
                </div>

                <input type="hidden" id="input-editar-imagem-url">
                <input type="hidden" id="input-editar-jogo-id">

                <div class="form-botoes">
                    <button type="button" id="btn-cancelar-editar-jogo" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-acao">Salvar alterações</button>
                </div>
            </form>
        </section>

        <section id="tela-editar-etapa" style="display: none;">
            <button id="btn-voltar-editar-etapa" class="btn-secundario">← Voltar</button>

            <h2>Editar etapa</h2>

            <form id="form-editar-etapa">
                <div class="campo">
                    <label for="input-editar-numero">Número da etapa</label>
                    <input type="number" id="input-editar-numero" required min="1">
                </div>

                <div class="campo">
                    <label for="input-editar-titulo">Título da etapa (sem spoilers!)</label>
                    <input type="text" id="input-editar-titulo" required>
                </div>

                <div class="campo">
                    <label for="input-editar-pista-leve">Pista leve</label>
                    <textarea id="input-editar-pista-leve" rows="3" required></textarea>
                </div>

                <div class="campo">
                    <label for="input-editar-pista-media">Pista direta</label>
                    <textarea id="input-editar-pista-media" rows="3" required></textarea>
                </div>

                <div class="campo">
                    <label for="input-editar-resposta-completa">Passo completo</label>
                    <textarea id="input-editar-resposta-completa" rows="4" required></textarea>
                </div>

                <input type="hidden" id="input-editar-etapa-id">

                <div class="form-botoes">
                    <button type="button" id="btn-cancelar-editar-etapa" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-acao">Salvar alterações</button>
                </div>
            </form>
        </section>

    </main>

    <footer>
        <p>GuiaGamer &copy; 2026</p>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
